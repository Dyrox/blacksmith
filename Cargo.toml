[package]
name = "blacksmith"
version = "0.1.0"
edition = "2024"
description = "Project doctor for FL Studio and Ableton Live: finds the plugins a project can't open and repairs, relinks or upgrades them, without touching the original."
build = "build.rs"

[dependencies]
flate2 = "1.1.11"
iced = { version = "0.14", features = ["svg"] }
rfd = "0.18"
rusqlite = { version = "0.43.0", features = ["bundled"] }

# The .exe's icon and version info (build.rs; only when building on Windows).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
