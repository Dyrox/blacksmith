[package]
name = "blacksmith"
version = "0.1.0"
edition = "2024"
description = "Drop a DAW project in, get it back with VST2 plugins upgraded to VST3."

[dependencies]
iced = "0.14"
rfd = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
